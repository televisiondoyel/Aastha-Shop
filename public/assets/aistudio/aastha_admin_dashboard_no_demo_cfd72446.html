<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '৳'+Number(n||0).toLocaleString('en-BD')}function notify(s){document.getElementById('toastroot').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>document.getElementById('toastroot').innerHTML='',2500)}function pill(s){let c=['Pending','Processing','Assigned','Suspended'].includes(s)?'warn':['Cancelled','Failed','Blocked','Out of Stock'].includes(s)?'bad':['Shipped','Out for Delivery'].includes(s)?'blue':'';return `<span class="pill ${c}">${esc(s)}</span>`}function heading(t,d,a=''){return `<div class="heading"><div><h1>${t}</h1><p>${d}</p></div>${a}</div>`}function stat(t,v,d,k){return `<div class="card"><div class="stat-top"><span>${t}</span><span class="symbol">${ic(k)}</span></div><div class="value">${v}</div><div class="small">${d}</div></div>`}function toggleNav(v){document.getElementById('side').classList.toggle('open',v);document.getElementById('overlay').classList.toggle('show',v)}document.getElementById('nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b){render(b.dataset.page);toggleNav(false)}};function render(p){page=p;let names={dashboard:'Dashboard Overview',products:'Product Management',orders:'Order Management',customers:'Customer Management',inventory:'Inventory Management',delivery:'Delivery Management',categories:'Category & Brand Management',coupons:'Coupon & Discount Management',payments:'Payments · Cash on Delivery',reports:'Reports & Analytics',staff:'Staff & Permissions',settings:'Store Settings'};document.getElementById('crumb').textContent=names[p].replace(' Management','');document.getElementById('topTitle').textContent=names[p];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));let pages={dashboard,products,orders,customers,inventory,delivery,categories,coupons,payments,reports,staff,settings};document.getElementById('content').innerHTML=pages[p]();bind();if(p===' function dashboard(){let sales=db.orders.filter(o=>o.status==='Delivered').reduce((s,o)=>s+o.total,0);return heading('Good evening, Admin','Here is what is happening with your store today.',`<button class="btn primary" onclick="openProduct()">Add Product</button>`)+`<div class="grid stats">${stat('Sales Summary',money(sales),'From delivered orders','chart')}${stat('Total Orders',db.orders.length,'Across all statuses','cart')}${stat('Active Deliveries',db.orders.filter(o=>['Shipped','Processing','Out for Delivery'].includes(o.status)).length,'Orders in progress','truck')}${stat('New Customers',db.customers.length,'Customer records in prototype','users')}</div><div class="grid cols"><div class="card"><div class="cardhead"><div><h2>Sales Overview</h2><p>Weekly sales trend</p></div><span class="pill">This week</span></div><div class="chart"><svg id="chart1" viewBox="0 0 600 220" preserveAspectRatio="none"></svg></div><div class="days"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div></div><div class="card"><div class="cardhead"><div><h2>Low Stock Alerts</h2><p>Products needing attention</p></div><button class="link" onclick="render('inventory')">View all</button></div><div class="alertlist">${db.products.filter(p=>p.stock<=db.settings.lowStock).map(p=>`<div class="alertrow"><div class="alertico">${ic('alert')}</div><div><strong>${esc(p.name)}</strong><small>${esc(p.category)}</small></div><div class="right">${p.stock===0?'<span style="color:#b43c3c">Out of stock</span>':p.stock+' '+esc(p.unit)+' left'}</div></div>`).join('')||'<div class="empty">No low stock products.</div>'}</div></div></div><div class="grid cols"><div class="card tablecard"><div class="cardhead"><div><h2>Recent Orders</h2><p>Latest order activity</p></div><button class="link" onclick="render('orders')">View all orders</button></div><div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>${db.orders.slice(0,5).map(o=>`<tr><td><b>${esc(o.id)}</b><div class="small">${esc(o.date)}</div></td><td>${esc(o.customer)}</td><td><b>${money(o.total)}</b></td><td>${pill(o.status)}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><div class="cardhead"><div><h2>Order Status</h2><p>Current order distribution</p></div></div><div class="progress">${['Pending','Processing','Shipped','Delivered','Cancelled'].map(s=>{let n=db.orders.filter(o=>o.status===s).length;return `<div class="prow"><span>${s}</span><b>${n}</b><div class="bar"><span style="width:${db.orders.length?Math.max(n/db.orders.length*100,n?7:0):0}%"></span></div></div>`}).join('')}</div></div></div><div class="footer">Sales and activity overview.</div>`}
function products(){return heading('Products','Manage product listings, prices, images and availability.',`<button class="btn primary" onclick="openProduct()">Add New Product</button>`)+`<div class="toolbar"><input id="qprod" placeholder="Search product or SKU"><select id="fprod"><option>All</option><option>Active</option><option>Inactive</option><option>Out of Stock</option></select><button class="btn" onclick="exportCSV('products')">${ic('download')} Export CSV</button></div><div class="card tablecard"><div class="tablewrap"><table><thead><tr><th>Product</th><th>Category / Brand</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody id="prows">${productRows(db.products)}</tbody></table></div></div>`}function productRows(a){return a.map(p=>`<tr><td><div class="product">${p.image?`<img class="thumb product-photo" src="${p.image}" alt="${esc(p.name)}">`:`<div class="thumb">${esc(p.name.split(' ').slice(0,2).map(x=>x[0]).join(''))}</div>`}<div><b>${esc(p.name)}</b><div class="small">${esc(p.sku)}</div></div></div></td><td>${esc(p.category)}<div class="small">${esc(p.brand)}</div></td><td><b>${money(p.price)}</b><div class="small">per ${esc(p.unit)}</div></td><td>${p.stock} ${esc(p.unit)}</td><td>${pill(p.stock===0?'Out of Stock':p.status)}</td><td><button class="link" onclick="openProduct(${p.id})">Edit</button><button class="link" style="color:#b43c3c" onclick="deleteProduct(${p.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">No products found.</div></td></tr>'}
function orders(){return heading('Orders','Review orders and update fulfillment status.')+`<div class="toolbar"><input id="qorder" placeholder="Search order or customer"><select id="forder">${['All','Pending','Confirmed','Processing','Shipped','Out for Delivery','Delivered','Cancelled'].map(s=>`<option>${s}</option>`).join('')}</select><button class="btn" onclick="exportCSV('orders')">${ic('download')} Export CSV</button></div><div class="card tablecard"><div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Update</th><th>Order details</th><th>Invoice</th></tr></thead><tbody id="orows">${orderRows(db.orders)}</tbody></table></div></div>`}function orderRows(a){return a.map(o=>`<tr><td><b>${esc(o.id)}</b><div class="small">${esc(o.date)}</div></td><td>${esc(o.customer)}<div class="small">${esc(o.phone)}</div></td><td>${o.items}</td><td><b>${money(o.total)}</b></td><td>${pill(o.payment)}</td><td>${pill(o.status)}</td><td><select onchange="updateOrder('${esc(o.id)}',this.value)">${['Pending','Confirmed','Processing','Shipped','Out for Delivery','Delivered','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="link" onclick="viewOrder('${esc(o.id)}')">View items</button></td><td><button class="link" onclick="downloadInvoice('${esc(o.id)}')">Download</button></td></tr>`).join('')||'<tr><td colspan="9"><div class="empty">No orders found.</div></td></tr>'}
function customers(){return heading('Customers','Manage customer details, account status and order history.')+`<div class="toolbar"><input id="qcustomer" placeholder="Search name or phone"><select id="fcustomer">${['All','Active','Suspended','Blocked'].map(s=>`<option>${s}</option>`).join('')}</select><button class="btn" onclick="exportCSV('customers')">${ic('download')} Export CSV</button></div><div class="card tablecard"><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Contact</th><th>Orders</th><th>Total Spent</th><th>Joined</th><th>Status</th><th>Actions</th></tr></thead><tbody id="crows">${customerRows(db.customers)}</tbody></table></div></div>`}function customerRows(a){return a.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="small">${esc(c.email)}</div></td><td>${esc(c.phone)}<div class="small">${esc(c.address)}</div></td><td>${c.orders}</td><td><b>${money(c.spent)}</b></td><td>${esc(c.joined)}</td><td>${pill(c.status)}</td><td><button class="link" onclick="viewCustomer(${c.id})">View</button><button class="link" onclick="suspendCustomer(${c.id})">${c.status==='Active'?'Suspend':'Activate'}</button><button class="link" style="color:#b43c3c" onclick="blockCustomer(${c.id})">${c.status==='Blocked'?'Unblock':'Block'}</button></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">No customers found.</div></td></tr>'}
function inventory(){return heading('Inventory','Track stock levels and restock low-quantity products.')+`<div class="grid stats">${stat('Tracked Products',db.products.length,'Catalog items','box')}${stat('Low Stock',db.products.filter(p=>p.stock>0&&p.stock<=db.settings.lowStock).length,'At or below alert level','alert')}${stat('Out of Stock',db.products.filter(p=>p.stock===0).length,'Unavailable products','layers')}${stat('Restock Needed',db.products.filter(p=>p.stock<=db.settings.lowStock).length,'Review these products','clock')}</div><div class="toolbar"><input id="qstock" placeholder="Search product"><button class="btn primary" onclick="stockModal()">Update Stock</button></div><div class="card tablecard"><div class="tablewrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Stock</th><th>Alert level</th><th>Status</th><th>Action</th></tr></thead><tbody id="stockrows">${stockRows(db.products)}</tbody></table></div></div>`}function stockRows(a){return a.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="small">${esc(p.category)}</div></td><td>${esc(p.sku)}</td><td><b>${p.stock} ${esc(p.unit)}</b></td><td>${db.settings.lowStock} ${esc(p.unit)}</td><td>${pill(p.stock===0?'Out of Stock':p.stock<=db.settings.lowStock?'Low Stock':'In Stock')}</td><td><button class="link" onclick="stockModal(${p.id})">Adjust stock</button></td></tr>`).join('')}

function coupons(){return heading('Coupons & Discounts','Create discount codes and control validity and usage limits.',`<button class="btn primary" onclick="couponModal()">Create Coupon</button>`)+`<div class="grid stats">${stat('Total Coupons',db.coupons.length,'All coupon records','ticket')}${stat('Active Coupons',db.coupons.filter(c=>c.active&&c.end>=new Date().toISOString().slice(0,10)).length,'Currently enabled','check')}${stat('Total Uses',db.coupons.reduce((s,c)=>s+c.used,0),'Usage recorded','chart')}${stat('Expired / Disabled',db.coupons.filter(c=>!c.active||c.end<new Date().toISOString().slice(0,10)).length,'Not currently usable','clock')}</div><div class="card tablecard"><div class="tablewrap"><table><thead><tr><th>Coupon</th><th>Discount</th><th>Min. order</th><th>Usage</th><th>Validity</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.coupons.map(c=>`<tr><td><b>${esc(c.code)}</b></td><td>${c.type==='Percentage'?c.value+'%':money(c.value)}</td><td>${money(c.min)}</td><td>${c.used} / ${c.limit}</td><td>${esc(c.start)}<div class="small">to ${esc(c.end)}</div></td><td>${pill(c.active&&c.end>=new Date().toISOString().slice(0,10)?'Active':'Expired')}</td><td><button class="link" onclick="toggleCoupon(${c.id})">${c.active?'Disable':'Enable'}</button><button class="link" onclick="deleteCoupon(${c.id})">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}

function modal(t,b,foot){document.getElementById('modalroot').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><b>${t}</b><button class="btn" onclick="closeModal()">Close</button></div><div class="modalbody">${b}</div><div class="modalfoot">${foot}</div></div></div>`}function closeModal(){document.getElementById('modalroot').innerHTML=''}function openProduct(id=null){editId=id;let p=id?db.products.find(x=>x.id===id):{name:'',sku:'',category:db.categories[0],brand:db.brands[0],price:'',stock:0,unit:'kg',status:'Active'};modal(id?'Edit Product':'Add New Product',`<form id="productForm"><div class="formgrid"><div class="field"><label>Product name *</label><input name="name" required value="${esc(p.name)}"></div><div class="field"><label>SKU *</label><input name="sku" required value="${esc(p.sku)}"></div><div class="field"><label>Category</label><select name="category">${db.categories.map(x=>`<option ${x===p.category?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Brand</label><select name="brand">${db.brands.map(x=>`<option ${x===p.brand?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Price (৳) *</label><input name="price" type="number" min="0" required value="${esc(p.price)}"></div><div class="field"><label>Stock quantity *</label><input name="stock" type="number" min="0" required value="${esc(p.stock)}"></div><div class="field"><label>Unit</label><select name="unit">${['kg','g','litre','ml','piece','pack','dozen'].map(x=>`<option ${x===p.unit?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status">${['Active','Inactive'].map(x=>`<option ${x===p.status?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field full"><label>Product photo — upload from phone gallery or computer</label><input id="productImageFile" type="file" accept="image/*" onchange="previewProductImage(event)"><input type="hidden" name="image" id="productImageData" value="${esc(p.image||'')}"><img id="productImagePreview" class="upload-preview" src="${esc(p.image||'')}" alt="Product preview" style="${p.image?'':'display:none;'}"></div></div></form><p class="small">Images are resized and saved in this browser for this prototype. A live multi-device store needs server/cloud image storage.</p>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveProduct()">Save Product</button>`)}function saveProduct(){let f=document.getElementById('productForm');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f).entries());d.price=+d.price;d.stock=+d.stock;if(db.products.some(p=>p.sku.toLowerCase()===d.sku.toLowerCase()&&p.id!==editId))return notify('SKU already exists.');if(editId)Object.assign(db.products.find(p=>p.id===editId),d);else db.products.unshift({id:Math.max(0,...db.products.map(p=>p.id))+1,...d});save();closeModal();render(page);notify(editId?'Product updated.':'Product added.')}function deleteProduct(id){let p=db.products.find(x=>x.id===id);if(p&&confirm('Delete '+p.name+'?')){db.products=db.products.filter(x=>x.id!==id);save();render('products');notify('Product deleted.')}}function updateOrder(id,s){let o=db.orders.find(x=>x.id===id);o.status=s;if(['Shipped','Out for Delivery','Delivered'].includes(s)){let d=db.deliveries.find(x=>x.order===id);if(!d){d={order:id,customer:o.customer,partner:o.delivery||'Unassigned',phone:'',status:s,tracking:''};db.deliveries.push(d)}else d.status=s}save();render('orders');notify('Order status updated.')}function ensureOrderItems(o){if(Array.isArray(o.itemsDetail)&&o.itemsDetail.length){o.itemsDetail=o.itemsDetail.map(x=>{let p=db.products.find(p=>p.name===x.name);return {...x,image:x.image||(p&&p.image)||''}});return o.itemsDetail}let n=Math.max(1,Math.min(6,Number(o.items)||1)),chosen=[];for(let i=0;i<n;i++){let p=db.products[i%Math.max(1,db.products.length)]||{name:'Grocery item',price:0,unit:'piece'};chosen.push({name:p.name,qty:1,unit:p.unit||'piece',price:0,image:p.image||''})}let each=Math.floor((Number(o.total)||0)/n),sum=0;chosen.forEach((x,i)=>{x.price=i===chosen.length-1?(Number(o.total)||0)-sum:each;sum+=x.price});o.itemsDetail=chosen;return chosen}
function viewOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;let items=ensureOrderItems(o);save();modal('Order details · '+o.id,`<div class="setting-row"><div><b>Customer</b><div class="small">${esc(o.customer)} · ${esc(o.phone)}</div><div class="small">${esc(o.address||'Address not recorded')}</div></div><div>${pill(o.status)}</div></div><div class="setting-row"><div><b>Order date</b><div class="small">${esc(o.date)}</div></div><div><b>Payment</b><div>${pill(o.payment)}</div></div></div><h3>Products ordered</h3><div class="tablewrap"><table><thead><tr><th>Product</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${items.map(x=>`<tr><td><div class="product">${x.image?`<img class="thumb product-photo" src="${x.image}" alt="${esc(x.name)}">`:`<div class="order-item-photo-placeholder">${esc(x.name.split(' ').slice(0,2).map(v=>v[0]||'').join(''))}</div>`}<b>${esc(x.name)}</b></div></td><td>${esc(x.qty)} ${esc(x.unit)}</td><td>${money(x.price)}</td></tr>`).join('')}</tbody></table></div><div class="invoice-total"><span>Recorded order total</span><b>${money(o.total)}</b></div><p class="small">The earlier order record stored only an item count, not the customer's actual product lines. For accurate order details, the website checkout must save each product, quantity and price to the same database.</p>`,`<button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="downloadInvoice('${esc(o.id)}')">Download Invoice</button>`)}

function compressImage(file,cb){if(!file||!file.type.startsWith('image/'))return notify('Please choose an image file.');let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let max=700,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.onerror=()=>notify('Could not read this image.');im.src=reader.result};reader.readAsDataURL(file)}

function viewCustomer(id){let c=db.customers.find(x=>x.id===id),a=db.orders.filter(o=>o.phone===c.phone);modal('Customer Profile',`<b>${esc(c.name)}</b><p>${esc(c.email)} · ${esc(c.phone)}</p><p>${esc(c.address)}</p><p>Recorded orders: <b>${c.orders}</b></p><p>Total spent: <b>${money(c.spent)}</b></p><h3>Order history</h3>${a.length?a.map(o=>`<div class="setting-row"><div><b>${esc(o.id)}</b><div class="small">${esc(o.date)} · ${esc(o.status)}</div></div><b>${money(o.total)}</b></div>`).join(''):'<p class="small">No matching orders in  data.</p>'}`,`<button class="btn" onclick="closeModal()">Close</button>`)}function suspendCustomer(id){let c=db.customers.find(x=>x.id===id);c.status=c.status==='Active'?'Suspended':'Active';save();render('customers')}function blockCustomer(id){let c=db.customers.find(x=>x.id===id);if(confirm((c.status==='Blocked'?'Unblock ':'Block ')+c.name+'?')){c.status=c.status==='Blocked'?'Active':'Blocked';save();render('customers')}}function stockModal(id=null){let p=id?db.products.find(x=>x.id===id):db.products[0];if(!p)return notify('Add a product first.');modal('Adjust Inventory',`<form id="stockForm"><div class="field"><label>Product</label><select name="id">${db.products.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)} · ${x.stock} ${esc(x.unit)}</option>`).join('')}</select></div><div class="field"><label>Adjustment</label><select name="mode"><option value="add">Add stock</option><option value="set">Set exact quantity</option><option value="remove">Remove stock</option></select></div><div class="field"><label>Quantity *</label><input name="qty" type="number" min="0" required></div></form>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveStock()">Save Stock</button>`)}function saveStock(){let f=document.getElementById('stockForm');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f).entries()),p=db.products.find(x=>x.id===+d.id),q=+d.qty;p.stock very assignment saved.')}function removeDelivery(i){if(confirm('Remove delivery assignment?')){db.deliveries.splice(i,1);save();render('delivery')}}function addName(t){nameModal('Add '+t,'',v=>{let a=t==='category'?db.categories:db.brands;if(a.some(x=>x.toLowerCase()===v.toLowerCase()))return notify('Already exists.');a.push(v);save();render('categories')})}function editName(t,i){let a=t==='category'?db.categories:db.brands;nameModal('Edit '+t,a[i],v=>{let old=a[i];a[i]=v;db.products.forEach(p=>{if(p[t]===old)p[t]=v});save();render('categories')})}function nameModal(t,v,cb){modal(t,`<div class="field"><label>Name</label><input id="nv" value="${esc(v)}" required></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="sv">Save</button>`);document.getElementById('sv').onclick=()=>{let x=document.getElementById('nv').value.trim();if(x)cb(x);closeModal()}}function deleteName(t,i){let a=t==='category'?db.categories:db.brands,n=a[i];if(db.products.some(p=>p[t]===n))return notify('Reassign this value from products before deleting.');if(confirm('Delete '+n+'?')){a.splice(i,1);save();render('categories')}}function couponModal(){modal('Create Coupon',`<form id="couponForm"><div class="formgrid"><div class="field"><label>Code *</label><input name="code" required></div><div class="field"><label>Discount type</label><select name="type"><option>Percentage</option><option>Fixed</option></select></div><div class="field"><label>Value *</label><input name="value" type="number" min="1" required></div><div class="field"><label>Minimum order (৳)</label><input name="min" type="number" min="0" value="0"></div><div class="field"><label>Usage limit *</label><input name="limit" type="number" min="1" value="100" required></div><div class="field"><label>Start date</label><input name="start" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field full"><label>Expiry date</label><input name="end" type="date" required></div></div></form>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCoupon()">Create Coupon</button>`)}function saveCoupon(){let f=document.getElementById('couponForm');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f).entries());d.code=d.code.trim().toUpperCase();if(d.end<d.start)return notify('Expiry must be after start date.');if(db.coupons.some(c=>c.code===d.code))return notify('Coupon already exists.');Object.assign(d,{id:Math.max(0,...db.coupons.map(c=>c.id))+1,value:+d.value,min:+d.min,limit:+d.limit,used:0,active:true});db.coupons.unshift(d);save();closeModal();render('coupons');notify('Coupon created.')}function toggleCoupon(id){let c=db.coupons.find(x=>x.id===id);c.active=!c.active;save();render('coupons')}function deleteCoupon(id){if(confirm('Delete coupon?')){db.coupons=db.coupons.filter(c=>c.id!==id);save();render('coupons')}}function collectCOD(id){let o=db.orders.find(x=>x.id===id);if(o.status!=='Delivered'&&!confirm('Order is not marked delivered. Confirm collection anyway?'))return;o.payment='Collected';save();render('payments');notify('COD collection confirmed.')}function staffModal(id=null){let s=id?db.staff.find(x=>x.id===id):{name:'',email:'',role:'Order Manager',status:'Active'};modal(id?'Edit Staff':'Add Staff',`<form id="staffForm"><div class="field"><label>Name *</label><input name="name" required value="${esc(s.name)}"></div><div class="field"><label>Email *</label><input name="email" type="email" required value="${esc(s.email)}"></div><div class="field"><label>Role</label><select name="role">${['Super Admin','Admin','Order Manager','Inventory Manager'].map(r=>`<option ${r===s.role?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status">${['Active','Inactive'].map(r=>`<option ${r===s.status?'selected':''}>${r}</option>`).join('')}</select></div></form>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveStaff(${id===null?'null':id})">Save</button>`)}function saveStaff(id){let f=document.getElementById('staffForm');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f).entries());if(db.staff.some(s=>s.email.toLowerCase()===d.email.toLowerCase()&&s.id!==id))return notify('Email already in use.');if(id===null){d.id=Math.max(0,...db.staff.map(s=>s.id))+1;db.staff.push(d)}else Object.assign(db.staff.find(s=>s.id===id),d);save();closeModal();render('staff')}function toggleStaff(id){let s=db.staff.find(x=>x.id===id);if(s.role==='Super Admin')return notify('Super Admin cannot be deactivated here.');s.status=s.status==='Active'?'Inactive':'Active';save();render('staff')}function deleteStaff(id){let s=db.staff.find(x=>x.id===id);if(!s)return;if(s.role==='Super Admin')return notify('Super Admin account is protected.');if(!confirm('Permanently delete staff member '+s.name+'? This action cannot be undone.'))return;db.staff=db.staff.filter(x=>x.id!==id);save();render('staff');notify('Staff member deleted.')}function saveSettings(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());Object.assign(db.settings,{name:d.name,address:d.address,phone:d.phone,email:d.email});save();notify('Store information saved.')}function savePrefs(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());Object.assign(db.settings,{currency:d.currency,tax:+d.tax,lowStock:+d.lowStock,deliveryCharge:+d.deliveryCharge});save();render('settings');notify('Preferences saved.')}function previewLogo(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{db.settings.logo=r.result;let img=document.getElementById('logoPreview');img.src=r.result;img.style.display='block';save();notify('Logo preview saved locally.')};r.readAsDataURL(f)}function exportCSV(type){let rows=db[type]||[];if(!rows.length)return notify('No records to export.');let keys=Object.keys(rows[0]),text=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n'),url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download='aastha-'+type+'.csv';a.click();URL.revokeObjectURL(url)}function backup(){let url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='aastha-admin-backup.json';a.click();URL.revokeObjectURL(url)}function resetData(){if(confirm('Reset all browser data?')){db=clone(seed);save();render('settings')}}function drawChart(id){let el=document.getElementById(id);if(!el)return;let v=[34,55,43,72,60,88,70];el.innerHTML='<defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#77a88b" stop-opacity=".25"/><stop offset="100%" stop-color="#77a88b" stop-opacity="0"/></linearGradient></defs>'+[0,1,2,3].map(i=>`<line x1="30" y1="${20+i*55}" x2="585" y2="${20+i*55}" stroke="#edf1ee" stroke-dasharray="4 5"/>`).join('')+`<path d="M ${v.map((n,i)=>`${35+i*90},${195-n*1.7}`).join(' L ')} L 575 205 L 35 205 Z" fill="url(#fill)"/><polyline points="${v.map((n,i)=>`${35+i*90},${195-n*1.7}`).join(' ')}" fill="none" stroke="#36745d" stroke-width="3" stroke-linecap="round"/>${v.map((n,i)=>`<circle cx="${35+i*90}" cy="${195-n*1.7}" r="4" fill="white" stroke="#36745d" stroke-width="2"/>`).join('')}`}document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){render('products');document.getElementById('qprod').value=e.target.value.trim();filterProducts()}});render('dashboard');
