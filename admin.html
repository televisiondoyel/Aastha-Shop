<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baromasi Admin Dashboard</title>
<link id="sitefavicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23087e6e'/%3E%3Ctext x='24' y='32' text-anchor='middle' font-size='28' fill='white' font-family='Arial'%3EB%3C/text%3E%3C/svg%3E">
<style>
:root{
  --g:#16864b;
  --g2:#32a45e;
  --sage:#eaf7ef;
  --bg:#f4f7f5;
  --line:#e1e9e4;
  --muted:#718078;
  --text:#20352a;
}
*,*::before,*::after{box-sizing:border-box;border-radius:0!important}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:13px Arial,Helvetica,sans-serif;
  line-height:1.45;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

/* Side navigation */
.side{
  position:fixed;
  inset:0 auto 0 0;
  width:238px;
  height:100vh;
  background:#173e32;
  color:#d9e8df;
  padding:18px 12px;
  overflow-y:auto;
  z-index:25;
  transition:transform .2s ease;
}
.brand{
  display:flex;
  gap:11px;
  align-items:center;
  padding:4px 6px 18px;
  border-bottom:1px solid #ffffff1a;
}
.mark{
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  background:#e3efe6;
  color:var(--g);
  font-weight:900;
  font-size:19px;
}
.brand b{display:block;color:#fff;font-size:17px;letter-spacing:-.3px}
.brand small{color:#a9c6b6;text-transform:uppercase;letter-spacing:1.4px;font-size:9px}
.label{font-size:10px;color:#91b6a2;letter-spacing:1.4px;text-transform:uppercase;margin:20px 8px 7px;font-weight:700}
.nav{display:grid;gap:3px}
.nav button{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:9px 10px;
  border:0;
  background:none;
  color:#c9ddd1;
  text-align:left;
  font-size:12px;
}
.nav button:hover{background:#ffffff12;color:#fff}
.nav button.active{background:#249c56;color:#fff;font-weight:700}
.nav button.active .ico svg{stroke:#fff}
.ico{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-badge{margin-left:auto;background:#e53e3e;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;line-height:14px}
.unread-row{background:#fafffb}

/* Main content */
.main{margin-left:238px;min-height:100vh;display:flex;flex-direction:column}
.top{
  height:60px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:15;
}
.crumb{font-size:11px;color:var(--muted)}
.top h3{margin:2px 0 0;font-size:15px;color:var(--text);font-weight:700}
.topright{display:flex;align-items:center;gap:10px}
.search{border:1px solid var(--line);padding:8px 12px;width:240px;background:#f9fbfa;outline:none;font-size:12px}
.search:focus{border-color:var(--g2);background:#fff}
.avatar{background:#e5f6eb;color:var(--g);width:36px;height:36px;display:grid;place-items:center;font-weight:800;font-size:12px;border:1px solid #c9decb;overflow:hidden;cursor:pointer;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.brand-logo-wrap{position:relative;cursor:pointer;flex-shrink:0}
.brand-logo-img{max-height:38px;max-width:54px;object-fit:contain;background:#fff;padding:2px;display:block;border:1px solid #ffffff33}
.brand-logo-wrap:hover{opacity:.9}
.content{padding:22px 24px;max-width:1600px;width:100%;margin:0 auto;flex:1}
.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.heading h1{font-size:22px;margin:0 0 4px;color:#213b2c;letter-spacing:-.4px}
.heading p{margin:0;color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:#fff;padding:8px 13px;font-weight:600;font-size:12px;color:#34483b}
.btn:hover{background:#f3f7f4}
.primary{background:var(--g);border-color:var(--g);color:#fff}
.primary:hover{background:#137340}

/* Grid & Cards */
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:15px}
.card{background:#fff;border:1px solid var(--line);padding:16px;min-width:0}
.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;font-weight:700}
.symbol{width:34px;height:34px;background:#eaf7ef;color:var(--g);display:grid;place-items:center}
.value{font-size:24px;font-weight:800;letter-spacing:-.5px;margin:10px 0 2px;color:#183e2c}
.small{font-size:11px;color:var(--muted)}
.cols{grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);margin-bottom:15px}
.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;gap:10px}
.cardhead h2{font-size:14px;margin:0;color:#203b2c;font-weight:700}
.cardhead p{font-size:11px;color:var(--muted);margin:2px 0 0}
.chart{height:190px}
.chart svg{width:100%;height:100%}
.days{display:flex;justify-content:space-between;color:#8a978f;font-size:10px;padding:4px 6px 0}
.progress{display:grid;gap:14px}
.prow{display:grid;grid-template-columns:1fr auto;gap:5px;font-size:11px}
.bar{height:6px;background:#edf2ee;grid-column:1/-1;overflow:hidden}
.bar span{height:100%;display:block;background:var(--g2)}

/* Tables */
.tablecard{padding:0;overflow:hidden}
.tablecard .cardhead{padding:15px 16px 0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{background:#f6f9f7;color:#65786c;font-size:10px;text-transform:uppercase;letter-spacing:.6px;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-weight:700}
td{font-size:12px;padding:11px 14px;border-bottom:1px solid #edf2ee;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafdface}

/* Clean status pills - no borders, no rounded pill boxes, plain color indicators */
.pill,.status,.status-badge,.badge,.tag,[class*="status"]{
  background:transparent!important;
  border:0!important;
  outline:0!important;
  box-shadow:none!important;
  padding:0!important;
  display:inline!important;
  font-weight:700!important;
  color:#1b7b43!important;
  font-size:11px!important;
}
.pill.warn{color:#a86111!important}
.pill.bad{color:#b73232!important}
.pill.blue{color:#29659b!important}

.product{display:flex;align-items:center;gap:10px}
.product-photo{width:46px!important;height:46px!important;min-width:46px;object-fit:contain;background:#fff;border:1px solid #e1e9e3!important;padding:2px}
.thumb{width:46px;height:46px;min-width:46px;background:#edf5ef;color:#356e4c;display:grid;place-items:center;font-size:12px;font-weight:800;border:1px solid #e1e9e3}
.link{border:0;background:none;color:var(--g2);font-size:11px;font-weight:700;padding:2px 5px}
.link:hover{text-decoration:underline}

/* Low stock alert list */
.alertlist{display:grid;gap:10px}
.alertrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #f0f4f1}
.alertrow:last-child{border-bottom:0}
.alertico{width:32px;height:32px;background:#fff4e7;color:#a86519;display:grid;place-items:center;flex-shrink:0}
.alertrow strong{display:block;font-size:12px;color:#22362a}
.alertrow small{font-size:11px;color:var(--muted)}
.alertrow .right{margin-left:auto;text-align:right;font-size:11px;font-weight:700}

/* Toolbars & Forms */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid #dce5df;padding:9px 11px;background:#fff;color:var(--text);outline:none;font-size:12px}
.toolbar input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--g2);box-shadow:0 0 0 1px #32a45e22}
.toolbar input{min-width:210px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:11px;font-weight:700;color:#2c4033}
.field input,.field select,.field textarea{width:100%}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.full{grid-column:1/-1}
.notice{background:#eff6f0;color:#2f6942;padding:11px 14px;font-size:12px;margin-bottom:14px;border-left:3px solid var(--g)}

/* Modal & Toast */
.modalbg{position:fixed;inset:0;background:#0d241977;z-index:40;display:grid;place-items:center;padding:14px}
.modal{width:min(640px,100%);max-height:92vh;overflow-y:auto;background:#fff;border:1px solid #c7d8cd;box-shadow:0 10px 40px #0b241630}
.modalhead,.modalfoot{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.modalhead b{font-size:14px;color:#1e3829}
.modalfoot{border-bottom:0;border-top:1px solid var(--line);justify-content:flex-end;gap:8px}
.modalbody{padding:18px}
.toast{position:fixed;right:20px;bottom:20px;background:#173e32;color:#fff;padding:11px 16px;z-index:50;box-shadow:0 6px 20px #0003;font-size:12px;font-weight:600}
.empty{text-align:center;padding:26px;color:var(--muted);font-size:12px}
.menu{display:none}
.footer{padding:14px 0 6px;font-size:11px;color:var(--muted)}
.overlay{display:none}
.upload-preview{max-width:140px;max-height:140px;object-fit:contain;border:1px solid var(--line);margin-top:7px;display:block;background:#fff;padding:2px}
.category-photo{width:48px;height:42px;object-fit:contain;background:#f4f8f5;display:block;margin-bottom:4px;border:1px solid #dfe9e2}
.file-mini{font-size:10px;max-width:130px}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid #edf2ee}
.setting-row:last-child{border-bottom:0}
.invoice-total{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line);margin-top:12px;font-size:15px}

/* Notifications UI */
.notif-badge{
  position:absolute;
  top:-5px;
  right:-5px;
  background:#d9383a;
  color:#fff;
  font-size:10px;
  font-weight:700;
  height:18px;
  min-width:18px;
  padding:0 4px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 0 2px #fff;
}
.notif-panel{
  position:absolute;
  top:44px;
  right:0;
  width:360px;
  max-width:90vw;
  background:#fff;
  border:1px solid var(--b);
  box-shadow:0 12px 32px rgba(0,0,0,0.12);
  z-index:1050;
  animation:fadein 0.15s ease-out;
}
.notif-header{
  padding:12px 14px;
  background:#f8fafc;
  border-bottom:1px solid var(--b);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.notif-list{
  max-height:380px;
  overflow-y:auto;
}
.notif-item{
  padding:12px 14px;
  border-bottom:1px solid #f1f5f9;
  cursor:pointer;
  display:flex;
  gap:10px;
  align-items:flex-start;
  transition:background 0.15s;
}
.notif-item:hover{
  background:#f8fafc;
}
.notif-item.unread{
  background:#eaf7ef;
}
.notif-item.unread:hover{
  background:#def1e5;
}
.notif-icon{
  width:32px;
  height:32px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}
.notif-icon.order{
  background:#eaf7ef;
  color:#16864b;
}
.notif-icon.alert{
  background:#fef2f2;
  color:#dc2626;
}
.notif-icon.delivery{
  background:#eff6ff;
  color:#2563eb;
}
.notif-item h5{
  margin:0 0 2px 0;
  font-size:12px;
  font-weight:700;
  color:#0f172a;
}
.notif-item p{
  margin:0;
  font-size:11px;
  color:#475569;
  line-height:1.4;
}
.notif-item .time{
  font-size:10px;
  color:#94a3b8;
  margin-top:4px;
}

/* Banner & Promotion Management */
.banner-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:18px}
.banner-card{background:#fff;border:1px solid #dce5df;padding:16px;display:flex;flex-direction:column;gap:12px}
.banner-box{width:100%;background:#f5f8f5;border:1px dashed #c0d4c7;border-radius:6px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.banner-box img{width:100%;height:100%;object-fit:cover;display:block}
.banner-meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.banner-meta b{font-size:13px;color:#1e3829}
.banner-meta .tag{font-size:10px;font-weight:700;background:#eaf5ee;color:#18733f;padding:2px 8px;border-radius:4px}
.banner-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.storefront-mock{background:#f8faf8;border:1px solid #d8e4db;padding:14px;border-radius:8px;display:grid;grid-template-columns:2fr 1fr;gap:10px}
@media(max-width:768px){.storefront-mock{grid-template-columns:1fr}}
.storefront-mock .mock-hero{aspect-ratio:1200/360;border-radius:6px;overflow:hidden;background:#e9f2eb;display:flex}
.storefront-mock .mock-promos{display:grid;gap:8px}
.storefront-mock .mock-promo{aspect-ratio:600/350;border-radius:6px;overflow:hidden;background:#e9f2eb;display:flex}
.storefront-mock img{width:100%;height:100%;object-fit:cover}

/* Mobile responsive */
@media(max-width:1050px){
  .side{width:210px}
  .main{margin-left:210px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .cols{grid-template-columns:1fr}
  .content{padding:18px}
}
@media(max-width:720px){
  .side{width:250px;transform:translateX(-100%);z-index:35}
  .side.open{transform:translateX(0)}
  .main{margin-left:0}
  .menu{display:inline-flex}
  .overlay.show{display:block;position:fixed;inset:0;background:#0d241977;z-index:30}
  .top{padding:0 12px;height:56px}
  .search{display:none}
  .content{padding:14px 10px}
  .stats{gap:8px}
  .card{padding:12px}
  .value{font-size:20px}
  .heading h1{font-size:19px}
  .formgrid{grid-template-columns:1fr}
  .full{grid-column:auto}
  td,th{padding:9px 10px}
}
</style>
</head>
<body>
<div id="overlay" class="overlay" onclick="toggleNav(false)"></div>

<aside class="side" id="side">
  <div class="brand">
    <div class="brand-logo-wrap" id="brandLogoWrap" onclick="openLogoUploadModal()" title="Upload or change store logo">
      <div class="mark">B</div>
    </div>
    <div style="flex:1;min-width:0;cursor:pointer" onclick="openLogoUploadModal()" title="Upload or change store logo">
      <b>Baromasi</b>
      <small>Admin Dashboard</small>
    </div>
  </div>

  <div class="label">Workspace</div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico" data-i="dashboard"></span>Dashboard</button>
    <button data-page="products"><span class="ico" data-i="box"></span>Products</button>
    <button data-page="orders"><span class="ico" data-i="cart"></span>Orders</button>
    <button data-page="messages"><span class="ico" data-i="mail"></span>Customer Messages <span id="sideMsgBadge" class="side-badge" style="display:none">0</span></button>
    <button data-page="customers"><span class="ico" data-i="users"></span>Customers</button>
    <button data-page="inventory"><span class="ico" data-i="layers"></span>Inventory</button>
    <button data-page="delivery"><span class="ico" data-i="truck"></span>Delivery</button>
    <button data-page="categories"><span class="ico" data-i="folder"></span>Categories &amp; Brands</button>
    <button data-page="coupons"><span class="ico" data-i="ticket"></span>Coupons &amp; Discounts</button>
    <button data-page="payments"><span class="ico" data-i="wallet"></span>Payments (COD)</button>

    <div class="label">Management</div>
    <button data-page="banners"><span class="ico" data-i="image"></span>Banners &amp; Promotions</button>
    <button data-page="pages_content"><span class="ico" data-i="help"></span>About &amp; Contact Pages</button>
    <button data-page="reports"><span class="ico" data-i="chart"></span>Reports &amp; Analytics</button>
    <button data-page="staff"><span class="ico" data-i="shield"></span>Staff &amp; Permissions</button>
    <button data-page="settings"><span class="ico" data-i="settings"></span>Store Settings</button>
    <button data-page="back_to_store" style="color:#8fe3b1;margin-top:8px"><span class="ico" data-i="store"></span>Back to Store</button>
    <button data-page="logout" style="color:#ff8a80;margin-top:2px"><span class="ico" data-i="logout"></span>Log out</button>
  </nav>

  <div class="footer"></div>
</aside>

<main class="main">
  <header class="top">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn menu" onclick="toggleNav(true)" aria-label="Open menu">
        <span class="ico" data-i="menu"></span>
      </button>
      <div>
        <div class="crumb">Baromasi / <span id="crumb">Dashboard</span></div>
        <h3 id="topTitle">Dashboard Overview</h3>
      </div>
    </div>
    <div class="topright">
      <input class="search" id="globalSearch" placeholder="Search products...">
      <div class="notif-wrap" style="position:relative;display:inline-block">
        <button class="btn" id="notifBellBtn" onclick="toggleNotificationPanel()" aria-label="Notifications" title="Notifications" style="position:relative">
          <span class="ico" data-i="bell"></span>
          <span id="notifBadge" class="notif-badge" style="display:none">0</span>
        </button>
        <div id="notifPanel" class="notif-panel" style="display:none">
          <div class="notif-header">
            <div style="font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px">
              <span class="ico" data-i="bell"></span> Notifications (<span id="notifCountText">0</span>)
            </div>
            <div style="display:flex;gap:8px">
              <button class="link small" onclick="markAllNotificationsRead()" style="font-size:11px;text-decoration:none">Mark all as read</button>
              <button class="link small" onclick="clearAllNotifications()" style="font-size:11px;color:#c92a2a;text-decoration:none">Clear all</button>
            </div>
          </div>
          <div class="notif-list" id="notifList"></div>
        </div>
      </div>
      <a href="index.html#home" class="btn" title="View customer storefront" style="display:inline-flex;align-items:center;gap:5px">
        <span class="ico" data-i="store"></span> Storefront
      </a>
      <div class="avatar" id="topAdminAvatar" onclick="openAdminProfileModal()" title="Admin Profile &amp; Photo Upload">SA</div>
    </div>
  </header>

  <section class="content" id="content"></section>
</main>

<div id="modalroot"></div>
<div id="toastroot"></div>

<script type="module">
// Enforce admin login authentication
if (!sessionStorage.getItem('af_admin_session')) {
  window.location.replace('index.html#admin');
}

import {
  db as firestoreDb,
  saveProductToFirestore,
  deleteProductFromFirestore,
  getProductsFromFirestore,
  subscribeProducts,
  saveOrderToFirestore,
  deleteOrderFromFirestore,
  updateOrderStatusInFirestore,
  getOrdersFromFirestore,
  subscribeOrders,
  saveSettingsToFirestore,
  getSettingsFromFirestore,
  subscribeSettings,
  saveCategoriesToFirestore,
  getCategoriesFromFirestore,
  subscribeCategories,
  saveMessageToFirestore,
  getMessagesFromFirestore,
  updateMessageStatusInFirestore,
  deleteMessageFromFirestore,
  subscribeMessages
} from './src/firebase.ts';

// Pure SVG Icons - Absolutely ZERO emojis anywhere in the system
const icons = {
  dashboard: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="14" width="7" height="7"/>',
  box: '<path d="m12 3 9 5-9 5-9-5 9-5ZM3 8v9l9 5 9-5V8M3 8l9 5 9-5M12 13v9"/>',
  cart: '<circle cx="9" cy="20" r="1.5"/><circle cx="19" cy="20" r="1.5"/><path d="M2 3h2l2.6 12.2a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6L22 8H5"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  layers: '<path d="m12 2 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 17l9 5 9-5"/>',

function normalizeData() {
  db.products.forEach(p => {
    if (typeof p.image !== 'string') p.image = '';
    if (typeof p.sku !== 'string') p.sku = 'AST-PROD-' + String(p.id).padStart(3, '0');
    if (typeof p.brand !== 'string') p.brand = 'Baromasi Select';
    if (p.stock === undefined || p.stock === null) p.stock = 50;
    if (typeof p.unit !== 'string') p.unit = 'kg';
    if (typeof p.status !== 'string') p.status = 'Active';
    if (p.discount === undefined || p.discount === null) p.discount = 0;
    if (typeof p.description !== 'string') p.description = '';
  });
  db.orders.forEach(o => {
    if (!o.customer && o.name) o.customer = o.name;
    if (!o.area) o.area = 'Sandwip';
    if (!o.payment) o.payment = o.status === 'Delivered' ? 'Collected' : 'Pending';
    ensureOrderItems(o, true);
  });
  // Extract and preserve real customers from orders and existing records
  let custMap = new Map();
  db.customers.forEach(c => custMap.set(c.phone, c));
  let deletedPhones = [];
  try { deletedPhones = JSON.parse(localStorage.getItem('af_deleted_customers') || '[]'); } catch(e) {}
  let savedStatuses = {};
  try { savedStatuses = JSON.parse(localStorage.getItem('af_customer_statuses') || '{}'); } catch(e) {}

  db.orders.forEach(o => {
    if (o.phone && !deletedPhones.includes(o.phone)) {
      let existing = custMap.get(o.phone);
      if (existing) {
        existing.orders = db.orders.filter(x => x.phone === o.phone).length;
        existing.spent = db.orders.filter(x => x.phone === o.phone).reduce((s, x) => s + (x.total || 0), 0);
        if (o.area && !existing.area) existing.area = o.area;
        if (savedStatuses[o.phone]) existing.status = savedStatuses[o.phone];
      } else {
        let newC = {
          id: custMap.size + 1,
          name: o.customer || o.name || 'Customer',
          phone: o.phone,
          email: '',
          address: o.address || '',
          area: o.area || 'Sandwip',
          orders: 1,
          spent: o.total || 0,
          status: savedStatuses[o.phone] || 'Active',
          joined: (o.date || new Date().toISOString().slice(0, 10))
        };
        custMap.set(o.phone, newC);
      }
    }
  });
  db.customers = Array.from(custMap.values()).filter(c => !deletedPhones.includes(c.phone));
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function money(n) {
  return '৳ ' + Number(n || 0).toLocaleString('en-BD', { maximumFractionDigits: 2 });
}
function notify(s) {
  let root = document.getElementById('toastroot');
  if (root) {
    root.innerHTML = '<div class="toast">' + esc(s) + '</div>';
    clearTimeout(window.adminToastTimer);
    window.adminToastTimer = setTimeout(() => { root.innerHTML = ''; }, 2600);
  }
}

      }

} catch(e) {}

function seedInitialNotifications() {
  if (localStorage.getItem('af_notifications_seeded') === 'true') return;
  if (notifications.length > 0) return;
  if (Array.isArray(db.orders) && db.orders.length) {
    db.orders.slice(0, 6).forEach((o, idx) => {
      let items = ensureOrderItems(o);
      let summary = items.map(x => x.name).slice(0, 2).join(', ');
      notifications.push({
        id: 'notif_order_' + o.id,
        type: 'order',
        title: 'New Order: #' + o.id,
        message: (o.customer || o.name || 'Customer') + ' (' + (o.area || 'Sandwip') + ') — ' + (summary || 'Items') + ' — Total ' + money(o.total) + ' (Cash on Delivery)',
        time: o.date || 'Earlier',
        timestamp: Date.now() - (idx + 1) * 3600000,
        orderId: o.id,
        read: idx > 1
      });
    });
  }
  db.products.forEach(p => {
    if (p.stock <= 5 && p.stock > 0) {
      notifications.push({
        id: 'notif_stock_' + p.id,
        type: 'alert',
        title: 'Stock Alert: ' + p.name,
        message: 'Only ' + p.stock + ' ' + (p.unit || 'units') + ' left in stock. Please restock.',
        time: 'Today',
        timestamp: Date.now() - 7200000,
        read: false
      });
    } else if (p.stock === 0) {
      notifications.push({
        id: 'notif_oos_' + p.id,
        type: 'alert',
        title: 'Out of Stock: ' + p.name,
        message: 'This product is currently out of stock.',
        time: 'Today',
        timestamp: Date.now() - 3600000,
        read: false
      });
    }
  });
  try { localStorage.setItem('af_notifications_seeded', 'true'); } catch(e) {}
  saveNotifications();
}

function updateNotifBadge() {

    } else {
      badge.style.display = 'none';
    }
  }
  if (countText) {
    countText.textContent = unread;
  }
}

function playNotificationSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(587.33, now); // D5 note
    osc.frequency.setValueAtTime(880, now + 0.12); // A5 note
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.005, now + 0.45);
    osc.start(now);
    osc.stop(now + 0.48);
  } catch(e) {}
}

function addNotification(n) {
  notifications.unshift(n);

  saveNotifications();
  playNotificationSound();
  notify(n.title + ' — ' + n.message);
  renderNotificationList();
}

  list.innerHTML = notifications.map(n => `

function pill(s) {
  let c = ['Pending','Processing','Assigned','Suspended'].includes(s) ? 'warn' :
          ['Cancelled','Failed','Blocked','Out of Stock'].includes(s) ? 'bad' :
          ['Shipped','Out for Delivery'].includes(s) ? 'blue' : '';

window.saveProduct = async function() {
  let f = document.getElementById('productForm');
  if (!f || !f.reportValidity()) return;
  let formEntries = Object.fromEntries(new FormData(f).entries());
  let name = String(formEntries.name || '').trim();
  let sku = String(formEntries.sku || '').trim();
  let price = Math.max(0, +formEntries.price || 0);
  let old = Math.max(0, +formEntries.old || price);
  let discount = Math.max(0, Math.min(99, +formEntries.discount || 0));
  let stock = Math.max(0, +formEntries.stock || 0);
  let deal = formEntries.deal === 'true';
  let description = String(formEntries.description || '').trim();
  let image = formEntries.image || '';

  let obj = {
    id: editId || Date.now(),
    name,
    sku,
    category: formEntries.category || 'Pantry',
    brand: formEntries.brand || 'Baromasi Select',
    price,
    old,
    discount,
    stock,
    unit: formEntries.unit || 'kg',
    deal,
    status: stock === 0 ? 'Out of Stock' : (formEntries.status || 'Active'),
    description,
    image,
    updatedAt: new Date().toISOString()
  };

  if (editId) {
    db.products = db.products.map(p => p.id === editId ? obj : p);
  } else {
    db.products.unshift(obj);
  }
  saveLocal();
  closeModal();
  renderPage(page);
  notify(editId ? 'Product updated successfully.' : 'Product added successfully.');

  try {
    await saveProductToFirestore(obj);
  } catch(err) {
    console.error('Failed to save product to Firestore:', err);
  }
};

window.deleteProduct = async function(id) {

};

window.updateOrderStatus = async function(id, newStatus) {
  let o = db.orders.find(x => x.id === id);
  if (!o) return;
  let previousStatus = o.status;
  o.status = newStatus;

  // If status is changed to Delivered, automatically deduct stock from products
  if (newStatus === 'Delivered' && previousStatus !== 'Delivered') {
    let items = ensureOrderItems(o, true);
    items.forEach(item => {
      let p = db.products.find(prod => (item.id !== undefined && (prod.id === item.id || String(prod.id) === String(item.id))) || prod.name.toLowerCase() === item.name.toLowerCase());
      if (p && p.stock !== undefined) {
        let deductQty = Number(item.qty || 1);
        p.stock = Math.max(0, p.stock - deductQty);
        if (p.stock === 0) p.status = 'Out of Stock';
        saveProductToFirestore(p).catch(e => console.error('Error updating stock in cloud:', e));
      }
    });
    o.payment = 'Collected';
    notify('Order marked Delivered! Stock automatically deducted.');
  } else {
    notify('Order status updated to ' + newStatus);
  }

  // Delivery partner link
  if (['Shipped','Out for Delivery','Delivered'].includes(newStatus)) {
    let d = db.deliveries.find(x => x.order === id);
    if (!d) {
      db.deliveries.push({
        order: id,
        customer: o.customer,
        area: o.area || 'Sandwip',
        partner: o.delivery || 'Unassigned',
        phone: '',
        status: newStatus,
        tracking: ''
      });
    } else {
      d.status = newStatus;
    }
  }

  saveLocal();
  renderPage('orders');
  try {
    await updateOrderStatusInFirestore(o.id, newStatus);
  } catch(err) {
    console.error('Failed to update status in Firestore:', err);
  }
};

function calculateOrderFinancials(o, items) {
  let subtotal = items.reduce((sum, it) => sum + (Number(it.price) || 0) * (Number(it.qty) || 1), 0);
  if (o.subtotal === undefined || o.subtotal === null || o.subtotal === 0) {
    o.subtotal = subtotal;
  }
  let total = Number(o.total) || (o.subtotal + (Number(o.deliveryFee) || 0));
  if (o.deliveryFee === undefined || o.deliveryFee === null) {
    o.deliveryFee = Math.max(0, total - o.subtotal);
  }
  o.total = total;
}

function ensureOrderItems(o, forceRefresh = false) {
  let hasGenericItems = Array.isArray(o.itemsDetail) && o.itemsDetail.some(x => !x.name || x.name === 'Grocery item' || x.name === 'Teer Soybean Oil 5 Liters');
  if (Array.isArray(o.items) && o.items.length > 0 && (forceRefresh || !Array.isArray(o.itemsDetail) || !o.itemsDetail.length || hasGenericItems)) {
    let resolved = o.items.map(it => {
      let targetId = typeof it === 'object' && it !== null ? it.id : it;
      let targetQty = typeof it === 'object' && it !== null ? (Number(it.qty) || 1) : 1;
      let targetName = typeof it === 'object' && it !== null ? it.name : '';
      let targetPrice = typeof it === 'object' && it !== null && it.price !== undefined ? Number(it.price) : null;
      let targetUnit = typeof it === 'object' && it !== null ? it.unit : '';
      let targetImg = typeof it === 'object' && it !== null ? it.image : '';

      // Find matching product in db.products by ID or name
      let p = db.products.find(prod => 
        (targetId !== undefined && targetId !== null && (prod.id === targetId || String(prod.id) === String(targetId) || prod.id === Number(targetId))) ||
        (targetName && prod.name.toLowerCase() === targetName.toLowerCase())
      );

      let finalName = targetName || (p ? p.name : ('Product #' + targetId));
      let finalPrice = targetPrice !== null ? targetPrice : (p ? Number(p.price) : 0);
      let finalUnit = targetUnit || (p && p.unit) || 'kg';
      let finalImage = targetImg || (p && p.image) || '';

      return {
        id: targetId !== undefined ? targetId : (p ? p.id : 0),
        name: finalName,
        price: finalPrice,
        qty: targetQty,
        unit: finalUnit,
        image: finalImage
      };
    });

    calculateOrderFinancials(o, resolved);
    o.itemsDetail = resolved;
    return resolved;
  }

  if (Array.isArray(o.itemsDetail) && o.itemsDetail.length && o.itemsDetail.every(x => x && x.name && x.name !== 'Grocery item')) {
    o.itemsDetail = o.itemsDetail.map(x => {
      let p = db.products.find(prod => (x.id !== undefined && (prod.id === x.id || String(prod.id) === String(x.id))) || (x.name && prod.name.toLowerCase() === x.name.toLowerCase()));
      return {
        id: x.id !== undefined ? x.id : (p ? p.id : 0),
        name: x.name,
        price: Number(x.price !== undefined ? x.price : (p ? p.price : 0)),
        qty: Number(x.qty) || 1,
        unit: x.unit || (p && p.unit) || 'kg',
        image: x.image || (p && p.image) || ''
      };
    });
    calculateOrderFinancials(o, o.itemsDetail);
    return o.itemsDetail;
  }

  let fallback = [{
    id: 1,
    name: 'Ordered Item',
    price: Number(o.total) || 0,
    qty: 1,
    unit: 'item',
    image: ''
  }];
  calculateOrderFinancials(o, fallback);
  o.itemsDetail = fallback;
  return fallback;
}

  let savedStatuses = {};
  try { savedStatuses = JSON.parse(localStorage.getItem('af_customer_statuses') || '{}'); } catch(e) {}
  if (c.phone) savedStatuses[c.phone] = c.status;
  localStorage.setItem('af_customer_statuses', JSON.stringify(savedStatuses));
  saveLocal();
  renderPage('customers');
  notify('Customer status successfully updated to ' + c.status + '.');
};

window.deleteCustomer = function(id) {
  let c = db.customers.find(x => x.id === id);
  if (!c) return;
  if (confirm('Are you sure you want to delete customer "' + c.name + '"?')) {
    let deletedPhones = [];
    try { deletedPhones = JSON.parse(localStorage.getItem('af_deleted_customers') || '[]'); } catch(e) {}
    if (c.phone && !deletedPhones.includes(c.phone)) deletedPhones.push(c.phone);
    localStorage.setItem('af_deleted_customers', JSON.stringify(deletedPhones));
    db.customers = db.customers.filter(x => x.id !== id);
    saveLocal();
    renderPage('customers');
    notify('Customer "' + c.name + '" deleted successfully.');
  }
};

window.blockCustomer = function(id) {
  let c = db.customers.find(x => x.id === id);

  if (confirm((c.status === 'Blocked' ? 'Unblock ' : 'Block ') + c.name + '?')) {

};

        </select>

        <input name="qty" type="number" min="0" required placeholder="Enter quantity">
      </div>

window.saveStock = async function() {
  let f = document.getElementById('stockForm');
  if (!f || !f.reportValidity()) return;
  let d = Object.fromEntries(new FormData(f).entries());
  let p = db.products.find(x => x.id === +d.id);
  if (!p) return;
  let q = Math.max(0, +d.qty || 0);

  if (d.mode === 'add') p.stock = (p.stock || 0) + q;
  else if (d.mode === 'remove') p.stock = Math.max(0, (p.stock || 0) - q);
  else p.stock = q;

  if (p.stock === 0) p.status = 'Out of Stock';
  else if (p.status === 'Out of Stock') p.status = 'Active';

  saveLocal();
  closeModal();
  renderPage('inventory');
  notify('Stock updated for ' + p.name);

  try {
    await saveProductToFirestore(p);
  } catch(e) {
    console.error('Failed to sync stock to cloud:', e);
  }
};

window.saveDelivery = function() {
  let f = document.getElementById('deliveryForm');
  if (!f || !f.reportValidity()) return;
  let d = Object.fromEntries(new FormData(f).entries());
  let o = db.orders.find(x => x.id === d.order);
  let record = {
    order: d.order,
    customer: o ? o.customer : 'Customer',
    area: o ? (o.area || 'Sandwip') : 'Sandwip',
    partner: d.partner || 'Unassigned',
    phone: d.phone || '',
    status: d.status,
    tracking: d.tracking || ''
  };

  if (d.idx === '') db.deliveries.push(record);
  else db.deliveries[+d.idx] = record;

  if (o) {
    o.delivery = record.partner;
    if (['Shipped','Out for Delivery','Delivered'].includes(record.status)) {
      o.status = record.status;
      updateOrderStatusInFirestore(o.id, o.status).catch(e => console.error(e));
    }
  }

  saveLocal();
  closeModal();
  renderPage('delivery');
  notify('Delivery partner assignment saved.');
};

  if (confirm('Remove delivery assignment?')) {

};

window.saveCoupon = function() {
  let f = document.getElementById('couponForm');
  if (!f || !f.reportValidity()) return;
  let d = Object.fromEntries(new FormData(f).entries());
  d.code = d.code.trim().toUpperCase();
  if (d.end < d.start) return notify('Expiry date must be after start date.');
  if (db.coupons.some(c => c.code === d.code)) return notify('Coupon code already exists.');

  Object.assign(d, {
    id: Date.now(),
    value: +d.value,
    min: +d.min,
    limit: +d.limit,
    used: 0,
    active: true
  });
  db.coupons.unshift(d);
  saveLocal();
  closeModal();
  renderPage('coupons');
  notify('Coupon ' + d.code + ' created successfully.');
};

window.toggleCoupon = function(id) {
  let c = db.coupons.find(x => x.id === id);
  if (!c) return;
  c.active = !c.active;
  saveLocal();
  renderPage('coupons');
  notify('Coupon ' + c.code + ' is now ' + (c.active ? 'Active' : 'Disabled'));
};

window.deleteCoupon = function(id) {
  if (confirm('Delete this coupon?')) {
    db.coupons = db.coupons.filter(c => c.id !== id);
    saveLocal();
    renderPage('coupons');
  }
};

window.previewBannerUrl = function(key, url) {
  let cleanUrl = url.trim();
  let defaultSvg = key === 'hero' ? 'assets/banner.svg' : (key === 'promo1' ? 'assets/spices.svg' : 'assets/grains.svg');
  let targetSrc = cleanUrl || defaultSvg;
  let pImg = document.getElementById(key + 'PreviewImg');
  if (pImg) pImg.src = targetSrc;
  let mImg = document.getElementById(key === 'hero' ? 'mockHeroImg' : (key === 'promo1' ? 'mockPromo1Img' : 'mockPromo2Img'));
  if (mImg) mImg.src = targetSrc;
  db.settings[key] = cleanUrl;
};

window.uploadBannerFile = function(key, input) {
  let file = input.files && input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) return notify('Please select a valid image file.');
  notify('Processing image for ' + (key === 'hero' ? 'Fresh groceries banner' : (key === 'promo1' ? 'Spices promotion' : 'Grains promotion')) + '...');

  let reader = new FileReader();
  reader.onload = () => {
    let im = new Image();
    im.onload = async () => {
      let maxW = key === 'hero' ? 1200 : 700;
      let maxH = key === 'hero' ? 420 : 420;
      let scale = Math.min(1, maxW / im.width, maxH / im.height);
      let c = document.createElement('canvas');
      c.width = Math.round(im.width * scale);
      c.height = Math.round(im.height * scale);
      let ctx = c.getContext('2d');
      ctx.drawImage(im, 0, 0, c.width, c.height);
      let dataUrl = c.toDataURL('image/jpeg', 0.82);

      db.settings[key] = dataUrl;
      let pImg = document.getElementById(key + 'PreviewImg');
      if (pImg) pImg.src = dataUrl;
      let mImg = document.getElementById(key === 'hero' ? 'mockHeroImg' : (key === 'promo1' ? 'mockPromo1Img' : 'mockPromo2Img'));
      if (mImg) mImg.src = dataUrl;
      let urlInp = document.getElementById(key + 'UrlInput');
      if (urlInp) urlInp.value = dataUrl.slice(0, 50) + '...';

      saveLocal();
      let label = key === 'hero' ? 'Fresh groceries banner' : (key === 'promo1' ? 'Spices promotion' : 'Grains promotion');
      notify(label + ' uploaded and updated successfully!');
      try {
        await saveSettingsToFirestore({ [key]: dataUrl });
      } catch(err) {
        console.error('Failed to sync banner to Firestore:', err);
      }
    };
    im.onerror = () => notify('Unable to process the selected image.');
    im.src = reader.result;
  };
  reader.readAsDataURL(file);
};

window.resetBannerToDefault = async function(key) {
  let label = key === 'hero' ? 'Fresh groceries banner' : (key === 'promo1' ? 'Spices promotion' : 'Grains promotion');
  let defaultSvg = key === 'hero' ? 'assets/banner.svg' : (key === 'promo1' ? 'assets/spices.svg' : 'assets/grains.svg');

};

function compressImage(file, cb) {
  if (!file || !file.type.startsWith('image/')) return notify('Please select an image file.');
  let reader = new FileReader();
  reader.onload = () => {
    let im = new Image();
    im.onload = () => {
      let max = 650;
      let scale = Math.min(1, max / Math.max(im.width, im.height));
      let c = document.createElement('canvas');
      c.width = Math.round(im.width * scale);
      c.height = Math.round(im.height * scale);
      let ctx = c.getContext('2d');
      ctx.drawImage(im, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.8));
    };
    im.onerror = () => notify('Unable to process this image.');
    im.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function bind() {
  let qprod = document.getElementById('qprod');
  let fprod = document.getElementById('fprod');
  let fcat = document.getElementById('fcat');
  let filterP = () => {
    let q = (qprod?.value || '').toLowerCase();
    let f = fprod?.value || 'All';
    let c = fcat?.value || 'All';
    let filtered = db.products.filter(p => {
      let matchesQ = (p.name + ' ' + (p.sku || '') + ' ' + (p.category || '')).toLowerCase().includes(q);
      let matchesF = f === 'All' || (f === 'Out of Stock' ? Number(p.stock) === 0 : (p.status || 'Active') === f);
      let matchesC = c === 'All' || p.category === c;
      return matchesQ && matchesF && matchesC;
    });
    let prows = document.getElementById('prows');
    if (prows) prows.innerHTML = productRows(filtered);
  };
  if (qprod) qprod.oninput = filterP;
  if (fprod) fprod.onchange = filterP;
  if (fcat) fcat.onchange = filterP;

  let qorder = document.getElementById('qorder');
  let forder = document.getElementById('forder');
  let farea = document.getElementById('farea');
  let filterO = () => {
    let q = (qorder?.value || '').toLowerCase();
    let f = forder?.value || 'All';
    let a = farea?.value || 'All';
    let filtered = db.orders.filter(o => {
      let matchesQ = (o.id + ' ' + (o.customer || '') + ' ' + (o.phone || '')).toLowerCase().includes(q);
      let matchesF = f === 'All' || o.status === f;
      let matchesA = a === 'All' || o.area === a;
      return matchesQ && matchesF && matchesA;
    });
    let orows = document.getElementById('orows');
    if (orows) orows.innerHTML = orderRows(filtered);
  };
  if (qorder) qorder.oninput = filterO;
  if (forder) forder.onchange = filterO;
  if (farea) farea.onchange = filterO;

  let qcustomer = document.getElementById('qcustomer');
  let fcustomer = document.getElementById('fcustomer');
  let filterC = () => {
    let q = (qcustomer?.value || '').toLowerCase();
    let f = fcustomer?.value || 'All';
    let filtered = db.customers.filter(c => {
      let matchesQ = (c.name + ' ' + (c.phone || '') + ' ' + (c.area || '')).toLowerCase().includes(q);
      let matchesF = f === 'All' || c.status === f;
      return matchesQ && matchesF;
    });
    let crows = document.getElementById('crows');
    if (crows) crows.innerHTML = customerRows(filtered);
  };
  if (qcustomer) qcustomer.oninput = filterC;
  if (fcustomer) fcustomer.onchange = filterC;

  let qstock = document.getElementById('qstock');
  if (qstock) {
    qstock.oninput = () => {
      let q = qstock.value.toLowerCase();
      let srows = document.getElementById('stockrows');
      if (srows) {
        srows.innerHTML = stockRows(db.products.filter(p => (p.name + ' ' + (p.sku || '')).toLowerCase().includes(q)));
      }
    };
  }

  let sForm = document.getElementById('settingsForm');
  if (sForm) {
    sForm.onsubmit = async e => {
      e.preventDefault();
      let d = Object.fromEntries(new FormData(e.target).entries());
      Object.assign(db.settings, {
        name: d.name,
        address: d.address,
        phone: d.phone,
        email: d.email,
        logo: d.logo || db.settings.logo || '',
        favicon: d.favicon || db.settings.favicon || ''
      });
      saveLocal();
      if (db.settings.favicon) applyFavicon(db.settings.favicon);
      notify('Store business information saved.');
      try {
        await saveSettingsToFirestore({
          storeName: d.name,
          logo: db.settings.logo || '',
          favicon: db.settings.favicon || ''
        });
      } catch(err) {
        console.error(err);
      }
    };
  }

  let pForm = document.getElementById('prefForm');
  if (pForm) {
    pForm.onsubmit = async e => {
      e.preventDefault();
      let d = Object.fromEntries(new FormData(e.target).entries());
      Object.assign(db.settings, {
        currency: d.currency,
        deliveryCharge: +d.deliveryCharge,
        freeDelivery: +d.freeDelivery,
        lowStock: +d.lowStock
      });
      saveLocal();
      renderPage('settings');
      notify('Store preferences saved.');
      try {
        await saveSettingsToFirestore({
          deliveryFee: +d.deliveryCharge,
          freeDelivery: +d.freeDelivery
        });
      } catch(err) {
        console.error(err);
      }
    };
  }

  let logoInp = document.getElementById('logoFile');
  if (logoInp) {
    logoInp.onchange = e => {
      let f = e.target.files && e.target.files[0];
      if (!f) return;
      compressImage(f, data => {
        db.settings.logo = data;
        let prev = document.getElementById('logoPreview');
        let hidden = document.getElementById('logoData');
        if (prev) { prev.src = data; prev.style.display = 'block'; }
        if (hidden) hidden.value = data;
        saveLocal();
        notify('Store logo updated from gallery.');
        saveSettingsToFirestore({ logo: data }).catch(err => console.error(err));
      });
    };
  }

  let favInp = document.getElementById('faviconFile');
  if (favInp) {
    favInp.onchange = e => {
      let f = e.target.files && e.target.files[0];
      if (!f) return;
      compressImage(f, data => {
        db.settings.favicon = data;
        let prev = document.getElementById('faviconPreview');
        let hidden = document.getElementById('faviconData');
        if (prev) { prev.src = data; prev.style.display = 'block'; }
        if (hidden) hidden.value = data;
        saveLocal();
        applyFavicon(data);
        notify('Site icon / favicon updated successfully.');
        saveSettingsToFirestore({ favicon: data }).catch(err => console.error(err));
      }, true);
    };
  }
}

window.exportCSV = function(type) {
  let rows = db[type] || [];
  if (!rows.length) return notify('No records to export.');
  let keys = Object.keys(rows[0]).filter(k => k !== 'image' && k !== 'itemsDetail');
  let text = [
    keys.join(','),
    ...rows.map(r => keys.map(k => '"' + String(r[k] ?? '').replace(/"/g, '""') + '"').join(','))
  ].join('\r\n');
  let url = URL.createObjectURL(new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8;' }));
  let a = document.createElement('a');
  a.href = url;
  a.download = 'baromasi-' + type + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  notify('CSV exported successfully.');
};

window.backup = function() {
  let data = clone(db);
  let url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  let a = document.createElement('a');
  a.href = url;
  a.download = 'baromasi-admin-backup.json';
  a.click();
  URL.revokeObjectURL(url);
  notify('Complete store backup downloaded.');
};

// Global search
document.getElementById('globalSearch').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value.trim()) {
    renderPage('products');
    let q = document.getElementById('qprod');
    if (q) {
      q.value = e.target.value.trim();
      q.dispatchEvent(new Event('input'));
    }
  }
});

// Real-time Firestore synchronizers
subscribeProducts(remoteProducts => {
  if (Array.isArray(remoteProducts) && remoteProducts.length > 0) {
    db.products = remoteProducts.sort((a, b) => (b.id || 0) - (a.id || 0));
    normalizeData();
    saveLocal();
    if (['dashboard','products','inventory'].includes(page)) renderPage(page);
  }
});

let knownOrderIds = new Set((db.orders || []).map(o => o.id));
let isFirstSync = true;

subscribeOrders(remoteOrders => {
  if (Array.isArray(remoteOrders)) {
    if (!isFirstSync) {
      remoteOrders.forEach(ro => {
        if (!knownOrderIds.has(ro.id)) {
          knownOrderIds.add(ro.id);
          let items = ensureOrderItems(ro, true);
          let summary = items.map(x => x.name).slice(0, 2).join(', ');
          addNotification({
            id: 'notif_order_' + ro.id + '_' + Date.now(),
            type: 'order',
            title: 'New Order: #' + ro.id,
            message: (ro.customer || ro.name || 'Customer') + ' (' + (ro.area || 'Sandwip') + ') — ' + (summary || 'Items') + ' — Total ' + money(ro.total) + ' (Cash on Delivery)',
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            timestamp: Date.now(),
            orderId: ro.id,
            read: false
          });
        }
      });
    } else {
      remoteOrders.forEach(ro => knownOrderIds.add(ro.id));
      isFirstSync = false;
    }

    db.orders = remoteOrders;
    normalizeData();
    saveLocal();
    updateNotifBadge();
    if (['dashboard','orders','customers','payments','reports'].includes(page)) renderPage(page);
  }
});

subscribeCategories(remoteCats => {
  if (Array.isArray(remoteCats) && remoteCats.length > 0) {
    db.categories = remoteCats.map(c => typeof c === 'string' ? c : c.name);
    remoteCats.forEach(c => {
      if (c && c.name && c.image) db.categoryImages[c.name] = c.image;
    });
    saveLocal();
    if (['categories','products'].includes(page)) renderPage(page);
  }
});

// =================== LOGO & ADMIN PROFILE PHOTO UPLOAD ===================
function renderBrandLogo() {
  let wrap = document.getElementById('brandLogoWrap');
  if (!wrap) return;
  let logo = db.settings.logo || localStorage.getItem('af_logo');
  if (logo) {
    wrap.innerHTML = `<img src="${logo}" alt="Baromasi Logo" class="brand-logo-img">`;
  } else {
    wrap.innerHTML = `<div class="mark" title="Click to upload logo">B</div>`;
  }
}
window.renderBrandLogo = renderBrandLogo;

window.openLogoUploadModal = function() {
  let currentLogo = db.settings.logo || localStorage.getItem('af_logo') || '';
  modal('Store Logo — Upload or Change', `
    <div style="margin-bottom:14px">
      <p class="small" style="margin:0 0 10px">Upload the official store logo from your mobile phone gallery or computer. It will display in the Admin Dashboard header and website.</p>
      <div style="text-align:center;padding:16px;background:#f6f9f7;border:1px dashed #c0d5c6;margin-bottom:14px">
        <div id="modalLogoPreviewWrap">
          ${currentLogo ? `<img id="modalLogoPreview" src="${currentLogo}" alt="Logo" style="max-height:80px;max-width:180px;object-fit:contain;background:#fff;padding:4px">` : `<div style="color:var(--muted);font-size:12px">No custom logo uploaded yet. Upload an image to replace the plain 'B' icon.</div>`}
        </div>
      </div>
      <div class="field">
        <label>Select Logo File (PNG, JPG, WebP)</label>
        <input type="file" id="modalLogoFileInput" accept="image/*">
        <input type="hidden" id="modalLogoData" value="${esc(currentLogo)}">
      </div>
    </div>
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    ${currentLogo ? `<button class="btn" style="color:#b43c3c" onclick="removeLogo()">Remove Logo</button>` : ''}
    <button class="btn primary" onclick="saveLogoFromModal()">Save Logo</button>
  `);

  let fileInp = document.getElementById('modalLogoFileInput');
  if (fileInp) {
    fileInp.onchange = e => {
      let f = e.target.files && e.target.files[0];
      if (!f) return;
      compressImage(f, dataUrl => {
        let hidden = document.getElementById('modalLogoData');
        let wrap = document.getElementById('modalLogoPreviewWrap');
        if (hidden) hidden.value = dataUrl;
        if (wrap) wrap.innerHTML = `<img id="modalLogoPreview" src="${dataUrl}" alt="Logo" style="max-height:80px;max-width:180px;object-fit:contain;background:#fff;padding:4px">`;
        notify('Logo photo selected from device!');
      });
    };
  }
};

window.saveLogoFromModal = async function() {
  let hidden = document.getElementById('modalLogoData');
  let dataUrl = hidden ? hidden.value : '';
  if (!dataUrl) return notify('Please select a logo image file.');
  db.settings.logo = dataUrl;
  try { localStorage.setItem('af_logo', dataUrl); } catch(e) {}
  saveLocal();
  renderBrandLogo();
  closeModal();
  notify('Store logo saved and updated successfully!');
  try {
    await saveSettingsToFirestore({ logo: dataUrl });
  } catch(err) {
    console.error('Failed to save logo to Firestore:', err);
  }
};

window.removeLogo = async function() {
  if (confirm('Remove custom logo and revert to default icon?')) {
    db.settings.logo = '';
    try { localStorage.removeItem('af_logo'); } catch(e) {}
    saveLocal();
    renderBrandLogo();
    closeModal();
    notify('Logo removed.');
    try {
      await saveSettingsToFirestore({ logo: '' });
    } catch(err) {
      console.error(err);
    }
  }
};

function renderAdminAvatar() {
  let el = document.getElementById('topAdminAvatar');
  if (!el) return;
  let avatar = localStorage.getItem('af_admin_avatar') || db.settings.adminAvatar || '';
  if (avatar) {
    el.innerHTML = `<img src="${avatar}" alt="Admin Photo">`;
  } else {
    el.textContent = 'SA';
  }
}
window.renderAdminAvatar = renderAdminAvatar;

window.openAdminProfileModal = function() {
  let currentAvatar = localStorage.getItem('af_admin_avatar') || db.settings.adminAvatar || '';
  let adminName = localStorage.getItem('af_admin_name') || db.settings.adminName || 'Super Admin';
  modal('Admin Profile &amp; Photo', `
    <div style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;padding:12px;background:#f6f9f7;border:1px solid #dce8df">
        <div id="modalAvatarPreviewWrap" style="width:68px;height:68px;background:#e5f6eb;color:var(--g);display:grid;place-items:center;font-weight:800;font-size:20px;overflow:hidden;flex-shrink:0;border:1px solid #cadcd0">
          ${currentAvatar ? `<img src="${currentAvatar}" alt="Avatar" style="width:100%;height:100%;object-fit:cover">` : 'SA'}
        </div>
        <div>
          <b style="font-size:14px;display:block">${esc(adminName)}</b>
          <span class="small" style="color:var(--muted)">Store Administrator</span>
          <p class="small" style="margin:4px 0 0;color:#2b6f48">Upload your profile photo from your mobile gallery or computer.</p>
        </div>
      </div>
      <div class="field">
        <label>Admin Display Name</label>
        <input id="modalAdminNameInp" value="${esc(adminName)}" placeholder="e.g. Super Admin or Your Name">
      </div>
      <div class="field">
        <label>Upload Profile Picture (JPG, PNG, WebP)</label>
        <input type="file" id="modalAdminPhotoFile" accept="image/*">
        <input type="hidden" id="modalAdminPhotoData" value="${esc(currentAvatar)}">
        <small class="small">Select any photo from your mobile gallery. It will appear on your top-bar avatar.</small>
      </div>
    </div>
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    ${currentAvatar ? `<button class="btn" style="color:#b43c3c" onclick="removeAdminPhoto()">Remove Photo</button>` : ''}
    <button class="btn primary" onclick="saveAdminProfile()">Save Profile &amp; Photo</button>
  `);

  let photoInp = document.getElementById('modalAdminPhotoFile');
  if (photoInp) {
    photoInp.onchange = e => {
      let f = e.target.files && e.target.files[0];
      if (!f) return;
      compressImage(f, dataUrl => {
        let hidden = document.getElementById('modalAdminPhotoData');
        let wrap = document.getElementById('modalAvatarPreviewWrap');
        if (hidden) hidden.value = dataUrl;
        if (wrap) wrap.innerHTML = `<img src="${dataUrl}" alt="Avatar" style="width:100%;height:100%;object-fit:cover">`;
        notify('Profile picture selected from gallery!');
      });
    };
  }
};

window.saveAdminProfile = async function() {
  let nameInp = document.getElementById('modalAdminNameInp');
  let photoData = document.getElementById('modalAdminPhotoData');
  let name = nameInp ? nameInp.value.trim() : 'Super Admin';
  let avatar = photoData ? photoData.value : '';

  try {
    localStorage.setItem('af_admin_name', name || 'Super Admin');
    if (avatar) localStorage.setItem('af_admin_avatar', avatar);
    db.settings.adminAvatar = avatar;
    db.settings.adminName = name;
  } catch(e) {}

  renderAdminAvatar();
  closeModal();
  notify('Admin profile photo and details saved successfully!');

  try {
    await saveSettingsToFirestore({
      adminAvatar: avatar || '',
      adminName: name || 'Super Admin'
    });
  } catch(err) {
    console.error('Failed to sync admin profile to Firestore:', err);
  }
};

window.removeAdminPhoto = async function() {
  if (confirm('Remove admin profile photo?')) {
    try {
      localStorage.removeItem('af_admin_avatar');
      db.settings.adminAvatar = '';
    } catch(e) {}
    renderAdminAvatar();
    closeModal();
    notify('Profile photo removed.');
    try {
      await saveSettingsToFirestore({ adminAvatar: '' });
    } catch(err) {
      console.error(err);
    }
  }
};

subscribeSettings(remoteSettings => {
  if (remoteSettings && typeof remoteSettings === 'object') {
    if (remoteSettings.storeName) db.settings.name = remoteSettings.storeName;
    if (remoteSettings.deliveryFee !== undefined) db.settings.deliveryCharge = remoteSettings.deliveryFee;
    if (remoteSettings.freeDelivery !== undefined) db.settings.freeDelivery = remoteSettings.freeDelivery;
    if (remoteSettings.dealEnd) db.settings.dealEnd = remoteSettings.dealEnd;
    if (remoteSettings.logo) { db.settings.logo = remoteSettings.logo; renderBrandLogo(); }
    if (remoteSettings.favicon !== undefined) { db.settings.favicon = remoteSettings.favicon; window.applyFavicon(remoteSettings.favicon); }
    if (remoteSettings.adminAvatar) { db.settings.adminAvatar = remoteSettings.adminAvatar; renderAdminAvatar(); }
    if (remoteSettings.hero !== undefined) db.settings.hero = remoteSettings.hero;
    if (remoteSettings.promo1 !== undefined) db.settings.promo1 = remoteSettings.promo1;
    if (remoteSettings.promo2 !== undefined) db.settings.promo2 = remoteSettings.promo2;
    saveLocal();
    if (page === 'settings' || page === 'banners') renderPage(page);
  }
});

// Initial boot
window.applyFavicon(db.settings.favicon || localStorage.getItem('af_favicon'));
seedInitialNotifications();
updateNotifBadge();
renderBrandLogo();
renderAdminAvatar();
renderPage('dashboard');
</script>
</body>
</html>
